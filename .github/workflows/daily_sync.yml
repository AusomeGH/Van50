name: Daily Autonomous Event Discovery & Sync

on:
  schedule:
    # Runs at 11:00 UTC every day (04:00 AM Vancouver / PDT)
    - cron: '0 11 * * *'
  workflow_dispatch: # Allows 1-click manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  daily-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests

      - name: Run Van50 Daily Automation Pipeline & Send Status Email
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFICATION_EMAIL_TO: ${{ secrets.NOTIFICATION_EMAIL_TO }}
        run: |
          python scripts/daily_automation.py --run-once --send-email

      - name: Commit and push updated catalog
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/events.json data/manual_review_queue.json data/automation_status.json js/data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync: Daily event catalog update [skip ci]" && git push)
