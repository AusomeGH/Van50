name: Hourly Status & Sold-Out Monitor

on:
  # Scheduled auto-runs disabled per user request:
  # schedule:
  #   - cron: '15 * * * *'
  workflow_dispatch: # Allows 1-click manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  hourly-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests

      - name: Execute Van50 Hourly Status & Sold-Out Monitor
        run: |
          python scripts/hourly_status_monitor.py --run-once

      - name: Commit and push updated event catalog & activity logs
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/events.json js/data.js data/live_ai_activity.json data/automation_logs/hourly_monitor.log
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-monitor: Hourly event status & sold-out sync [skip ci]" && git push)
