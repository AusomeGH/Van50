name: Gemini AI Autonomous Event Scout & Catalog Update

on:
  schedule:
    # Runs every morning at 13:00 UTC (06:00 AM Vancouver / PDT)
    - cron: '0 13 * * *'
  workflow_dispatch: # Allows 1-click manual activation from the GitHub Actions tab anytime!

permissions:
  contents: write

jobs:
  gemini-scout:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Gemini AI Scout
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/gemini_event_scout.py

      - name: Commit and push updated JSON catalogs
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/events_active.json data/events_archive.json data/venues_master.json data/festivals_master.json data/ticketing_sources.json data/discovery_sources.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Van50 Gemini AI event catalogs (JSON) [skip ci]" && git push)

