<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#040810" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#emeraldGrad)" stroke-width="3" stroke-opacity="0.3" />

  <!-- Mountain Silhouette in Background -->
  <path d="M 64 360 L 170 230 L 260 330 L 370 190 L 448 360 Z" fill="#1e293b" opacity="0.45" />
  <path d="M 120 360 L 220 260 L 300 360 Z" fill="#0f172a" opacity="0.6" />

  <!-- Stylized Evergreen Tree (Vancouver Rainforest Iconography) -->
  <g filter="url(#shadow)">
    <!-- Tree Trunk -->
    <rect x="238" y="340" width="36" height="60" rx="6" fill="#78350f" opacity="0.9" />
    <!-- Bottom Tier -->
    <path d="M 140 350 L 372 350 L 320 270 L 344 270 L 256 160 L 168 270 L 192 270 Z" fill="url(#emeraldGrad)" />
    <!-- Middle Tier Highlight -->
    <path d="M 180 280 L 332 280 L 290 215 L 308 215 L 256 140 L 204 215 L 222 215 Z" fill="#34d399" opacity="0.35" />
    <!-- Top Apex -->
    <path d="M 210 215 L 302 215 L 256 130 Z" fill="#6ee7b7" opacity="0.85" />
  </g>

  <!-- Coastal Ocean Wave Accent -->
  <path d="M 40 400 Q 140 370, 256 400 T 472 400" fill="none" stroke="url(#cyanGrad)" stroke-width="8" stroke-linecap="round" opacity="0.85" />
  <path d="M 80 424 Q 180 398, 256 420 T 432 420" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-linecap="round" opacity="0.5" />

  <!-- "50" Glowing Budget Badge Pill -->
  <g filter="url(#glow)">
    <rect x="176" y="52" width="160" height="56" rx="28" fill="#0f172a" stroke="url(#emeraldGrad)" stroke-width="3" />
    <text x="256" y="90" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      VAN<tspan fill="#34d399">50</tspan>
    </text>
  </g>
</svg>
