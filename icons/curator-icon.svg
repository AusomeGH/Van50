<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="curatorBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#curatorBgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.35" />

  <!-- Master Shield Emblem -->
  <g filter="url(#dropShadow)">
    <!-- Outer Shield Boundary -->
    <path d="M 256 70 L 396 120 C 396 270, 340 375, 256 430 C 172 375, 116 270, 116 120 Z" 
          fill="#111827" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round" />
    <!-- Inner Shield Inset -->
    <path d="M 256 94 L 372 136 C 372 258, 326 348, 256 396 C 186 348, 140 258, 140 136 Z" 
          fill="#1e293b" fill-opacity="0.7" stroke="url(#cyanGrad)" stroke-width="2.5" stroke-opacity="0.6" stroke-linejoin="round" />
  </g>

  <!-- Center Security Lock & Checkmark Motif -->
  <g filter="url(#shieldGlow)">
    <!-- Lock Shackle -->
    <path d="M 220 220 L 220 185 C 220 160, 292 160, 292 185 L 292 220" 
          fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
    <!-- Lock Body -->
    <rect x="204" y="220" width="104" height="84" rx="16" fill="url(#goldGrad)" />
    <!-- Keyhole -->
    <circle cx="256" cy="254" r="9" fill="#0f172a" />
    <path d="M 253 258 L 259 258 L 261 282 L 251 282 Z" fill="#0f172a" />
  </g>

  <!-- Lightning Verification Spark -->
  <path d="M 264 316 L 244 346 L 260 346 L 248 376 L 274 340 L 256 340 Z" fill="#38bdf8" />

  <!-- "CURATOR" Bottom Banner Pill -->
  <g filter="url(#dropShadow)">
    <rect x="136" y="420" width="240" height="52" rx="26" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2.5" />
    <text x="256" y="456" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      CURATOR
    </text>
  </g>
</svg>
